name: Royal Club Owner-Approved APK Build (one-time)

on:
  push:
    branches:
      - release/owner-approved-apk-2026-10-30

permissions:
  contents: read

concurrency:
  group: royal-club-owner-approved-apk-2026-10-30
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        working-directory: apps/mobile
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi

      - name: Ensure release APK has Internet permission
        working-directory: apps/mobile
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          echo "Verified Android INTERNET permission in the main release manifest."

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Verify deployed API and database health
        id: endpoint
        env:
          API_BASE_URL: https://br-misty-flower-bavs47dm-royalclubapi.compute.c-8.eu-central-1.aws.neon.tech
        run: |
          API_BASE_URL="${API_BASE_URL%/}"
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL is not configured; refusing to build a release APK."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 12 "$API_BASE_URL/api/v1/health" --output health.json &&
               node -e 'const x=JSON.parse(require("node:fs").readFileSync("health.json","utf8")); if(x.status!=="ok")process.exit(1)'; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::The deployed Royal Club API failed its health check."
              cat health.json 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 12 "$API_BASE_URL/api/v1/health/db" --output database-health.json &&
               node -e 'const x=JSON.parse(require("node:fs").readFileSync("database-health.json","utf8")); if(x.status!=="ok"||x.database!=="connected")process.exit(1)'; then
              echo "The deployed Royal Club API and database passed health checks."
              echo "url=$API_BASE_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::The deployed Royal Club API did not confirm database connectivity."
              cat database-health.json 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

      - name: Build release APK
        working-directory: apps/mobile
        env:
          API_BASE_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          test -n "$API_BASE_URL"
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --tree-shake-icons --dart-define="API_BASE_URL=$API_BASE_URL"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-club-android-arm64-release-20261030
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
