name: Royal Club Android APK

on:
  push:
    branches:
      - 'apk-build/1.1.15'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build a release APK only when explicitly requested'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: royal-club-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        working-directory: apps/mobile
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi
          for PERMISSION in RECORD_AUDIO ACCESS_NETWORK_STATE CHANGE_NETWORK_STATE MODIFY_AUDIO_SETTINGS; do
            if ! grep -q "android.permission.$PERMISSION" "$MANIFEST"; then
              sed -i "/<manifest[^>]*>/a\\    <uses-permission android:name=\"android.permission.$PERMISSION\" />" "$MANIFEST"
            fi
          done
          if ! grep -q 'android.hardware.microphone' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\\    <uses-feature android:name="android.hardware.microphone" android:required="false" />' "$MANIFEST"
          fi
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' "$MANIFEST"

      - name: Ensure release APK has Internet permission
        working-directory: apps/mobile
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          echo "Verified Android INTERNET permission in the main release manifest."
          grep -n 'android.permission.INTERNET' "$MANIFEST"

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Verify deployed API and database health
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        id: endpoint
        env:
          API_BASE_URL: https://br-misty-flower-bavs47dm-royalclubapi.compute.c-8.eu-central-1.aws.neon.tech
        run: |
          API_BASE_URL="${API_BASE_URL%/}"
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL is not configured; refusing to build a release APK."
            exit 1
          fi
          echo "Checking the deployed API health endpoint."
          if ! curl --fail --silent --show-error --connect-timeout 5 --max-time 12 "$API_BASE_URL/api/v1/health" --output health.json; then
            echo "::error::The deployed Royal Club API is not reachable; no APK will be built."
            exit 1
          fi
          if ! node -e 'const x=JSON.parse(require("node:fs").readFileSync("health.json","utf8")); if(x.status!=="ok")process.exit(1)'; then
            echo "::error::The deployed Royal Club API health check did not return status=ok."
            head -c 2000 health.json || true
            exit 1
          fi
          echo "Checking the API database connection."
          if ! curl --fail --silent --show-error --connect-timeout 5 --max-time 12 "$API_BASE_URL/api/v1/health/db" --output database-health.json; then
            echo "::error::The deployed Royal Club API database health endpoint is not reachable."
            exit 1
          fi
          if ! node -e 'const x=JSON.parse(require("node:fs").readFileSync("database-health.json","utf8")); if(x.status!=="ok"||x.database!=="connected")process.exit(1)'; then
            echo "::error::The deployed Royal Club API did not confirm a connected database."
            head -c 2000 database-health.json || true
            exit 1
          fi
          echo "The deployed Royal Club API and database passed health checks."
          echo "url=$API_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        working-directory: apps/mobile
        env:
          API_BASE_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            echo "Building APK with the verified Royal Club API endpoint."
            flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --tree-shake-icons --dart-define="API_BASE_URL=$API_BASE_URL"
          else
            echo "::error::API_BASE_URL is not configured; refusing to build a release APK without an API endpoint."
            exit 1
          fi

      - name: Upload installable APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        uses: actions/upload-artifact@v4
        with:
          name: royal-club-android-arm64-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
