name: Chess module isolated validation
on:
  push:
    branches:
      - feature/standalone-chess-module
    paths:
      - "chess-module/**"
      - ".github/workflows/chess-module.yml"
  pull_request:
    paths:
      - "chess-module/**"
      - ".github/workflows/chess-module.yml"
permissions:
  contents: read
jobs:
  chess-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-module/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  chess-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-module/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
