name: Chess module isolated validation
on:
  push:
    branches:
      - feature/standalone-chess-module
    paths:
      - "chess-module/**"
      - ".github/workflows/chess-module.yml"
  pull_request:
    paths:
      - "chess-module/**"
      - ".github/workflows/chess-module.yml"
permissions:
  contents: read
jobs:
  chess-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-module/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chess-module/api/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
