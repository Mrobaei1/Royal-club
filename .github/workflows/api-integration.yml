name: Royal Club API integration tests

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-integration.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: royalclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d royalclub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/royalclub_test
      JWT_SECRET: royal-club-integration-test-secret-32-characters
      NEON_FUNCTION_RUNTIME: "1"
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Build API
        working-directory: apps/api
        run: npm run build
      - name: Run API integration tests
        working-directory: apps/api
        run: npm run test:integration
