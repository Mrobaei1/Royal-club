name: Validate Royal Club

on:
  push:
    branches:
      - feature/password-min-6
  pull_request:
  workflow_dispatch:

concurrency:
  group: royal-club-validate-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify Neon Function bundle
        run: |
          npx --yes esbuild@0.25.12 src/neon-function.ts --bundle --platform=node --target=node24 --format=esm --outfile=/tmp/royal-club-neon-function.mjs
          test -s /tmp/royal-club-neon-function.mjs
          test "$(stat -c%s /tmp/royal-club-neon-function.mjs)" -lt 134217728

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
