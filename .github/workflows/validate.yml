name: Validate Royal Club

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
      - feature/password-min-6
  pull_request:
  workflow_dispatch:

concurrency:
  group: royal-club-validate-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify Neon Function bundle
        run: |
          npx --yes esbuild@0.25.12 src/neon-function.ts --bundle --platform=node --target=node24 --format=esm --outfile=/tmp/royal-club-neon-function.mjs
          test -s /tmp/royal-club-neon-function.mjs
          test "$(stat -c%s /tmp/royal-club-neon-function.mjs)" -lt 134217728

  api-integration:
    name: API integration tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: royalclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d royalclub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/royalclub_test
      JWT_SECRET: royal-club-integration-test-secret-32-characters
      NEON_FUNCTION_RUNTIME: "1"
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:8080
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
