name: Royal Club Web Preview

on:
  push:
    branches:
      - main
      - feature/password-min-6
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: royal-club-web-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Build API
        working-directory: apps/api
        run: npm run build
      - name: Test API
        working-directory: apps/api
        run: npm test
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test
        working-directory: apps/mobile
        run: flutter test
      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --org com.royalclub .
      - name: Build Android APK
        working-directory: apps/mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://br-misty-flower-bavs47dm-royalclubapi.compute.c-8.eu-central-1.aws.neon.tech' }}
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --tree-shake-icons --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-club-android-arm64-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build web preview
        working-directory: apps/mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://br-misty-flower-bavs47dm-royalclubapi.compute.c-8.eu-central-1.aws.neon.tech' }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            echo "Building web preview with the Royal Club API endpoint."
            flutter build web --release --base-href /Royal-club/ --dart-define="API_BASE_URL=$API_BASE_URL"
          else
            echo "::warning::API_BASE_URL is not configured. Registration and online services will show a setup message."
            flutter build web --release --base-href /Royal-club/
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
