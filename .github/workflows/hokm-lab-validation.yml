name: Hokm isolated lab validation

on:
  push:
    branches:
      - research/hokm-standalone
    paths:
      - "standalone/hokm-lab/**"
      - ".github/workflows/hokm-lab-validation.yml"
  pull_request:
    paths:
      - "standalone/hokm-lab/**"
      - ".github/workflows/hokm-lab-validation.yml"

permissions:
  contents: read

jobs:
  hokm-lab:
    name: Node 20 — Hokm rules and room tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hokm_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hokm_lab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HOKM_LIVE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hokm_lab_test
    defaults:
      run:
        working-directory: standalone/hokm-lab
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check source and tests
        run: |
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install live PostgreSQL test driver
        run: npm install --no-save pg@8
      - name: Run Hokm lab tests including live PostgreSQL acceptance
        run: npm test

  flutter-ui:
    name: Flutter — standalone Hokm UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone/hokm-lab/flutter
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Verify Dart formatting
        run: dart format lib test
      - name: Analyze Flutter UI
        run: flutter analyze
      - name: Run Flutter widget tests
        run: flutter test
