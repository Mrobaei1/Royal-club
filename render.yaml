# Render Blueprint for a test deployment of Royal Club API.
# Review Render's current free-tier limits before creating resources.
services:
  - type: web
    name: royal-club-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: royal-club-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://mrobaei1.github.io

databases:
  - name: royal-club-db
    databaseName: royalclub
    user: royalclub
    plan: free
    region: frankfurt
